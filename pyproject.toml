[project]
name = "RAG_against_the_machine"
version = "1.6"
description = "A Retrieval-Augmented Generation (RAG) system that answers questions about the vLLM codebase, using BM25 retrieval over chunked source code and documentation, and Qwen3-0.6B for answer generation."
readme = "README.md"
authors = [
    { name = "dansimoe"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pydantic",
    "flake8",
    "mypy",
	"accelerate",
    "transformers",
    "torch",
    "bm25s",
    "fire",
    "tqdm"
]

[tool.mypy]
plugins = ["pydantic.mypy"]
